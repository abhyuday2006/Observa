<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>OBSERVA - Sign Up</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>OBSERVA</h1>


            <input
                id="name"
                type="text"
                placeholder="Full Name"
            >

            <input
                id="email"
                type="email"
                placeholder="Email"
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
            >

            <button id="signupBtn">
                Create Account
            </button>

            <p class="switch">

                Already have an account?

                <a href="login.html">
                    Sign In
                </a>

            </p>

        </div>

    </div>

    <script src="signup.js"></script>

</body>

</html>
