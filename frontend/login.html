<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSERVA Login</title>

    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container">

    <div class="login-card">

        <h1>OBSERVA</h1>

        <p class="subtitle">
            Real-Time Log Analytics Platform
        </p>

        <input
            id="email"
            type="email"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button id="loginBtn">
            Login
        </button>

        <p class="footer">
            New here?
            <a href="signup.html">Create Account</a>
        </p>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
